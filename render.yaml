databases:
  - name: menu-engineering
    plan: free
    databaseName: menu_engineering
    user: quadrante

services:
  - type: web
    name: quadrante-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PGHOST
        fromDatabase:
          name: menu-engineering
          property: host
      - key: PGPORT
        fromDatabase:
          name: menu-engineering
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: menu-engineering
          property: database
      - key: PGUSER
        fromDatabase:
          name: menu-engineering
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: menu-engineering
          property: password
      - key: CORS_ALLOWED_ORIGINS
        sync: false
