spring.application.name=projeto

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:menu_engineering}${DB_PARAMS:}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

spring.data.web.pageable.max-page-size=100

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=MENU_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${COOKIE_SAMESITE:lax}
server.servlet.session.cookie.partitioned=${COOKIE_PARTITIONED:false}

app.cors.origens=${CORS_ORIGENS:http://localhost:5173}
app.semente.habilitada=${SEMENTE:true}
app.semente.email=${SEMENTE_EMAIL:admin@quadrante.local}
app.semente.senha=${SEMENTE_SENHA:Admin123}
app.pepper=${APP_PEPPER:quadrante-dev-pepper}
app.recuperacao.expor-token=${EXPOR_TOKEN_RECUPERACAO:true}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.cache.time-to-live=10s
